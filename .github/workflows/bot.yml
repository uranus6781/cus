name: ⚽ Scrape Bóng Đá M3U8

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    # QUAN TRỌNG: Cấp quyền ghi để không bị treo khi push file
    permissions:
      contents: write
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests playwright playwright-stealth PyGithub
        playwright install --with-deps chromium

    - name: 🚀 Run bot
      env:
        # Sử dụng GITHUB_TOKEN mặc định của hệ thống
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        python main.py

    - name: 📄 Show output
      run: |
        ls -la
        if [ -f bongda.m3u ]; then
          echo "✅ Thành công: bongda.m3u đã được tạo."
          head -n 10 bongda.m3u
        else
          echo "❌ Thất bại: Không tìm thấy file đầu ra."
          exit 1
        fi
